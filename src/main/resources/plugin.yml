name: CustomItemsPlugin
version: 1.0.0
main: com.example.customitems.CustomItemsPlugin
api-version: 1.21
author: YourName
description: Custom items API with version support (1.21.3, 1.21.4, 1.21.8)

commands:
  customitem:
    description: カスタムアイテム管理コマンド
    usage: /customitem <give|list|check|version>
    aliases: [ci, citem]
    permission: customitems.use

permissions:
  customitems.use:
    description: カスタムアイテムコマンドの使用権限
    default: op
  customitems.admin:
    description: カスタムアイテム管理権限
    default: op
